[project]
name = "rmt-assignment3-project"
version = "0.1.0"
description = "Local RAG support chat for Ozon products with Ollama"
readme = "README.md"
authors = [
    { name = "Yevgeniy Averyanov", email = "ewgenik02032006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "snowballstemmer>=3.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rmt_assignment3_project"
